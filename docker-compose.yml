# Local development stack: PostgreSQL + FastAPI (which also serves the frontend).
# Start with: docker compose up --build   ->  http://localhost:8000
# Values come from .env when present, otherwise the development defaults below are used.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-speakquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speakquest}
      POSTGRES_DB: ${POSTGRES_DB:-speakquest}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./src/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-speakquest}:${POSTGRES_PASSWORD:-speakquest}@db:5432/${POSTGRES_DB:-speakquest}
      # development: an unsafe SECRET_KEY is only a warning; any other value refuses to start with it
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      # Request limits (defaults as in src/api/app/core/config.py)
      DIALOGUE_RATE_LIMIT: ${DIALOGUE_RATE_LIMIT:-10}
      DIALOGUE_RATE_WINDOW_SECONDS: ${DIALOGUE_RATE_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5}
      REGISTER_RATE_WINDOW_SECONDS: ${REGISTER_RATE_WINDOW_SECONDS:-60}
      PASSWORD_CHECK_RATE_LIMIT: ${PASSWORD_CHECK_RATE_LIMIT:-5}
      PASSWORD_CHECK_RATE_WINDOW_SECONDS: ${PASSWORD_CHECK_RATE_WINDOW_SECONDS:-900}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Mount the source so code changes reload without rebuilding the image
    volumes:
      - ./src/api:/app
      - ./src/frontend:/frontend
    # Apply pending database migrations, load the story content (safe to repeat), then start the API
    command: sh -c "alembic upgrade head && python -m app.content.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  db-data:
