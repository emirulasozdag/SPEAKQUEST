name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  # Migrations and the tests on a real PostgreSQL, the database the app runs on
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: speakquest
          POSTGRES_PASSWORD: speakquest
          POSTGRES_DB: speakquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speakquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://speakquest:speakquest@localhost:5432/speakquest
      TEST_DATABASE_URL: postgresql+psycopg://speakquest:speakquest@localhost:5432/speakquest_test
      PGPASSWORD: speakquest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Exactly one migration head
        run: test "$(alembic heads | wc -l)" -eq 1 || { alembic heads; exit 1; }

      - name: Migrate an empty database up, check it matches the models, and back down
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Run the tests on PostgreSQL
        run: |
          psql -h localhost -U speakquest -d speakquest -c "CREATE DATABASE speakquest_test"
          pytest -q

  # Browser smoke tests of the main game flow (tests/browser): the real frontend in Chromium
  # against a live server with a test database and a fake AI
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run the browser tests
        run: pytest -m browser -v --screenshot only-on-failure --output test-results

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: src/api/test-results/
          if-no-files-found: ignore
