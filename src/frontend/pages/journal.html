<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your SpeakQuest quest journal: active, completed and locked quests.">
  <title>Quest journal – SpeakQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/pages/journal.js"></script>
</head>
<body data-auth="required">
  <header data-component="navbar" data-variant="game"></header>

  <main class="container py-5">
    <h1 class="h2 mb-2">Quest journal</h1>
    <p class="text-secondary mb-4">Every quest in the city: the ones you can play now, the ones you finished and what the locked ones are waiting for.</p>

    <div id="journal-alert" role="alert" hidden></div>
    <p id="journal-loading" class="text-secondary" role="status">
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading your quests…
    </p>

    <div id="journal-content" hidden>
      <section id="journal-next" class="mb-4" aria-label="What to do next" hidden></section>

      <ul class="nav nav-tabs mb-4" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tab-active" data-bs-toggle="tab" data-bs-target="#quests-active" type="button" role="tab" aria-controls="quests-active" aria-selected="true">Active <span class="sq-count" data-count="active"></span></button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-done" data-bs-toggle="tab" data-bs-target="#quests-done" type="button" role="tab" aria-controls="quests-done" aria-selected="false" tabindex="-1">Completed <span class="sq-count" data-count="done"></span></button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-locked" data-bs-toggle="tab" data-bs-target="#quests-locked" type="button" role="tab" aria-controls="quests-locked" aria-selected="false" tabindex="-1">Locked <span class="sq-count" data-count="locked"></span></button>
        </li>
      </ul>

      <div class="tab-content">
        <section class="tab-pane fade show active" id="quests-active" role="tabpanel" aria-labelledby="tab-active" tabindex="0"></section>
        <section class="tab-pane fade" id="quests-done" role="tabpanel" aria-labelledby="tab-done" tabindex="0"></section>
        <section class="tab-pane fade" id="quests-locked" role="tabpanel" aria-labelledby="tab-locked" tabindex="0"></section>
      </div>
    </div>
  </main>

  <footer data-component="footer"></footer>
</body>
</html>
