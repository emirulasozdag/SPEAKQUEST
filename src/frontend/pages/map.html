<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The SpeakQuest city map. Choose a place to visit.">
  <title>City map – SpeakQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/pages/map.js"></script>
</head>
<body data-auth="required">
  <header data-component="navbar" data-variant="game"></header>

  <main class="container py-5">
    <h1 class="h2 mb-2">Where to next?</h1>
    <p class="text-secondary mb-4">Choose a place to visit. Places unlock as the story moves on.</p>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="sq-panel">
          <svg class="sq-map" viewBox="0 0 800 480" role="group" aria-labelledby="map-title">
            <title id="map-title">City map: Linden Street and the city centre</title>
            <rect class="sq-ground" width="800" height="480" />
            <path class="sq-water" d="M0 425c120-20 220 20 340 0s240-25 460 5V480H0z" />
            <circle class="sq-park" cx="200" cy="80" r="52" />
            <circle class="sq-park" cx="262" cy="104" r="34" />
            <path class="sq-road" d="M-20 300H820M330 -20V420" />
            <path class="sq-road-line" d="M0 300H800M330 0V410" />

            <a class="sq-place sq-apartment" href="#place-detail" data-location="apartment" aria-label="Linden House">
              <g class="sq-building">
                <rect x="70" y="150" width="160" height="135" fill="#b5654a" />
                <rect x="60" y="138" width="180" height="16" rx="4" fill="#7a3b1d" />
                <g fill="#fff6e9"><rect x="88" y="170" width="34" height="28" rx="4" /><rect x="178" y="170" width="34" height="28" rx="4" /><rect x="88" y="214" width="34" height="28" rx="4" /><rect x="178" y="214" width="34" height="28" rx="4" /></g>
                <rect x="132" y="235" width="36" height="50" rx="18" fill="#2f8a5f" />
              </g>
              <g class="sq-place-label">
                <rect x="55" y="326" width="190" height="62" rx="14" />
                <text x="150" y="352" text-anchor="middle">Linden House</text>
                <text class="sq-place-status" x="150" y="375" text-anchor="middle" data-place-status>Loading…</text>
              </g>
            </a>

            <a class="sq-place sq-cafe" href="#place-detail" data-location="cafe" aria-label="Corner Café">
              <g class="sq-building">
                <rect x="385" y="190" width="130" height="95" fill="#fff6e9" />
                <path d="M375 190h150l-10 26H385z" fill="#c47812" />
                <path d="M400 190l-4 26M430 190v26M460 190v26M490 190l4 26" stroke="#fff6e9" stroke-width="8" />
                <rect x="398" y="232" width="56" height="34" rx="4" fill="#d9e3f8" />
                <rect x="468" y="230" width="32" height="55" rx="4" fill="#7a3b1d" />
                <path d="M440 150h22v18a11 11 0 0 1-22 0z" fill="#7a3b1d" />
              </g>
              <g class="sq-place-label">
                <rect x="365" y="326" width="170" height="62" rx="14" />
                <text x="450" y="352" text-anchor="middle">Corner Café</text>
                <text class="sq-place-status" x="450" y="375" text-anchor="middle" data-place-status>Loading…</text>
              </g>
            </a>

            <a class="sq-place sq-office" href="#place-detail" data-location="office" aria-label="Bright Path Travel">
              <g class="sq-building">
                <rect x="600" y="70" width="130" height="215" rx="6" fill="#3a62c9" />
                <g fill="#a9bdf0"><rect x="616" y="88" width="42" height="24" rx="3" /><rect x="672" y="88" width="42" height="24" rx="3" /><rect x="616" y="126" width="42" height="24" rx="3" /><rect x="672" y="126" width="42" height="24" rx="3" /><rect x="616" y="164" width="42" height="24" rx="3" /><rect x="672" y="164" width="42" height="24" rx="3" /><rect x="616" y="202" width="42" height="24" rx="3" /><rect x="672" y="202" width="42" height="24" rx="3" /></g>
                <rect x="648" y="244" width="34" height="41" rx="3" fill="#1e2a47" />
              </g>
              <g class="sq-place-label">
                <rect x="570" y="326" width="190" height="62" rx="14" />
                <text x="665" y="352" text-anchor="middle">Bright Path Travel</text>
                <text class="sq-place-status" x="665" y="375" text-anchor="middle" data-place-status>Loading…</text>
              </g>
            </a>
          </svg>
        </div>
      </div>

      <aside class="col-lg-4" aria-labelledby="places-title">
        <div id="map-alert" role="alert" hidden></div>
        <section id="place-detail" class="sq-panel sq-line-tag mb-4" aria-live="polite" tabindex="-1" hidden></section>

        <h2 id="places-title" class="sq-panel-title">Places</h2>
        <p id="places-loading" class="text-secondary" role="status">
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading the city…
        </p>
        <div id="places-list" class="d-grid gap-3"></div>
      </aside>
    </div>
  </main>

  <footer data-component="footer"></footer>
</body>
</html>
