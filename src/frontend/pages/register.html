<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a SpeakQuest account and start your English adventure.">
  <title>Create account – SpeakQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/pages/register.js"></script>
</head>
<body>
  <header data-component="navbar" data-variant="public"></header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <h1 class="h2 mb-2">Create your account</h1>
        <p class="text-secondary mb-4">Next, you will create the character who moves to the city.</p>

        <div id="register-alert" role="alert" hidden></div>

        <form id="register-form" class="sq-panel" novalidate>
          <div class="mb-3">
            <label for="register-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="register-email" name="email" autocomplete="email" required aria-describedby="register-email-error">
            <div id="register-email-error" class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="register-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="register-password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="register-password-help register-password-error">
            <div id="register-password-help" class="form-text">At least 8 characters.</div>
            <div id="register-password-error" class="invalid-feedback"></div>
          </div>
          <div class="mb-4">
            <label for="register-password-confirm" class="form-label">Repeat password</label>
            <input type="password" class="form-control" id="register-password-confirm" name="password_confirm" autocomplete="new-password" required aria-describedby="register-password-confirm-error">
            <div id="register-password-confirm-error" class="invalid-feedback"></div>
          </div>
          <p class="sq-privacy-note small mb-3">Your messages are sent to an AI service. Don't type real personal information. <a href="/pages/privacy.html">What we store</a></p>
          <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>

        <p class="mt-4 text-center">Already playing? <a href="/pages/login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <footer data-component="footer"></footer>
</body>
</html>
