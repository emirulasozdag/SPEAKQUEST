<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your SpeakQuest dashboard: level, XP, active quest and learning progress.">
  <title>Dashboard – SpeakQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/pages/dashboard.js"></script>
</head>
<body data-auth="required">
  <header data-component="navbar" data-variant="game"></header>

  <main class="container py-5">
    <div id="dashboard-alert" role="alert" hidden></div>

    <p id="dashboard-loading" class="text-secondary" role="status">
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading your adventure…
    </p>

    <div id="dashboard-content" hidden>
      <section class="d-flex flex-wrap align-items-center gap-4 mb-5" aria-labelledby="player-name">
        <img id="player-avatar" class="sq-avatar" src="/assets/avatars/avatar-1.svg" alt="">
        <div class="flex-grow-1">
          <h1 id="player-name" class="h2 mb-1"></h1>
          <p id="player-level" class="mb-2 text-secondary"></p>
          <div id="xp-bar" class="progress sq-xp" role="progressbar" aria-label="XP to next level" aria-valuemin="0">
            <div class="progress-bar"></div>
          </div>
          <p id="xp-text" class="small text-secondary mt-1 mb-0"></p>
        </div>
        <a id="continue-button" class="btn btn-lg btn-primary" href="/pages/map.html">Continue adventure</a>
      </section>

      <div class="row g-4">
        <section class="col-lg-7" aria-labelledby="active-quest-title">
          <div id="active-quest" class="sq-panel sq-line-tag h-100">
            <h2 id="active-quest-title" class="sq-panel-title">Active quest</h2>
            <div id="active-quest-body"></div>
          </div>
        </section>

        <section class="col-lg-5" aria-labelledby="completed-title">
          <div class="sq-panel h-100">
            <h2 id="completed-title" class="sq-panel-title">Completed quests</h2>
            <ul id="completed-list" class="list-unstyled mb-0"></ul>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer data-component="footer"></footer>
</body>
</html>
