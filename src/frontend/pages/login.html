<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log in to SpeakQuest and continue your story.">
  <title>Log in – SpeakQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/pages/login.js"></script>
</head>
<body>
  <header data-component="navbar" data-variant="public"></header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <h1 class="h2 mb-2">Welcome back</h1>
        <p class="text-secondary mb-4">Pick up where you left off.</p>

        <div id="login-alert" role="alert" hidden></div>

        <form id="login-form" class="sq-panel" novalidate>
          <div class="mb-3">
            <label for="login-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="login-email" name="email" autocomplete="email" required aria-describedby="login-email-error">
            <div id="login-email-error" class="invalid-feedback"></div>
          </div>
          <div class="mb-4">
            <label for="login-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="login-password" name="password" autocomplete="current-password" maxlength="72" required aria-describedby="login-password-error">
            <div id="login-password-error" class="invalid-feedback"></div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="mt-4 text-center">New here? <a href="/pages/register.html">Create an account</a></p>
      </div>
    </div>
  </main>

  <footer data-component="footer"></footer>
</body>
</html>
